name: Build Release Packages

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build dependencies
        run: python -m pip install -e ".[build]"
      - name: Build extension packages
        run: python scripts/build_extensions.py
      - name: Build Obsidian plugin package
        run: python scripts/build_obsidian_plugin.py
      - name: Build Windows native host
        run: >-
          python -m PyInstaller --onefile --clean
          --name bookmark-agent-native
          --distpath outputs
          --workpath work/pyinstaller-build
          --specpath work/pyinstaller-spec
          scripts/native_host_launcher.py
      - name: Remove generated Python caches
        shell: pwsh
        run: |
          $roots = @('src', 'server', 'scripts', 'extension', 'obsidian-plugin')
          foreach ($root in $roots) {
            if (Test-Path $root) {
              Get-ChildItem -LiteralPath $root -Recurse -Directory -Force |
                Where-Object { $_.Name -eq '__pycache__' } |
                Remove-Item -Recurse -Force
              Get-ChildItem -LiteralPath $root -Recurse -File -Force -Filter '*.pyc' |
                Remove-Item -Force
            }
          }
      - name: Create source bundle
        shell: pwsh
        run: Compress-Archive -Path README.md,SPEC.md,STORE_SUBMISSION.md,MONETIZATION.md,OBSIDIAN_PLUGIN_SUBMISSION.md,manifest.json,main.js,styles.css,versions.json,config.example.toml,extension,obsidian-plugin,src,server,scripts,install.ps1,install.sh,pyproject.toml -DestinationPath outputs/bookmark-intelligence-source.zip
      - name: Create Windows install bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package/outputs | Out-Null
          Copy-Item README.md,SPEC.md,STORE_SUBMISSION.md,MONETIZATION.md,OBSIDIAN_PLUGIN_SUBMISSION.md,manifest.json,main.js,styles.css,versions.json,config.example.toml,install.ps1,install.sh,pyproject.toml -Destination package/
          Copy-Item -Recurse extension,obsidian-plugin,src,server,scripts -Destination package/
          Copy-Item outputs/bookmark-agent-native.exe,outputs/chrome-extension.zip,outputs/firefox-extension.xpi,outputs/obsidian-bookmark-intelligence-plugin.zip -Destination package/outputs/
          Compress-Archive -Path package/* -DestinationPath outputs/bookmark-intelligence-windows.zip
      - name: Create release checksums
        shell: pwsh
        run: |
          $files = @(
            'outputs/bookmark-intelligence-windows.zip',
            'outputs/bookmark-intelligence-source.zip',
            'outputs/chrome-extension.zip',
            'outputs/firefox-extension.xpi',
            'outputs/obsidian-bookmark-intelligence-plugin.zip',
            'outputs/bookmark-agent-native.exe'
          )
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $file).Hash.ToLowerInvariant()
            "$hash  $(Split-Path -Leaf $file)"
          }
          $lines | Set-Content -Encoding ascii outputs/SHA256SUMS.txt
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            outputs/chrome-extension.zip
            outputs/firefox-extension.xpi
            outputs/bookmark-agent-native.exe
            outputs/obsidian-bookmark-intelligence-plugin.zip
            outputs/bookmark-intelligence-source.zip
            outputs/bookmark-intelligence-windows.zip
            outputs/SHA256SUMS.txt
