name: Build Release Packages

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build dependencies
        run: python -m pip install -e ".[build]"
      - name: Build extension packages
        run: python scripts/build_extensions.py
      - name: Build Windows native host
        run: >-
          python -m PyInstaller --onefile --clean
          --name bookmark-agent-native
          --distpath outputs
          --workpath work/pyinstaller-build
          --specpath work/pyinstaller-spec
          scripts/native_host_launcher.py
      - name: Create source bundle
        shell: pwsh
        run: Compress-Archive -Path README.md,SPEC.md,STORE_SUBMISSION.md,MONETIZATION.md,config.example.toml,extension,src,scripts,install.ps1,install.sh,pyproject.toml -DestinationPath outputs/bookmark-intelligence-source.zip
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            outputs/chrome-extension.zip
            outputs/firefox-extension.xpi
            outputs/bookmark-agent-native.exe
            outputs/bookmark-intelligence-source.zip
