[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "obsidian-bookmark-intelligence"
version = "0.2.3"
description = "Local-first Chrome/Firefox bookmark intelligence pipeline for Obsidian."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.32.0",
  "trafilatura>=1.12.0",
  "w3lib>=2.2.0",
  "winotify>=1.1.0; platform_system == 'Windows'",
  "yt-dlp>=2025.1.0"
]

[project.optional-dependencies]
build = [
  "cryptography>=42.0",
  "pyinstaller>=6.0"
]

[project.scripts]
bookmark-agent = "bookmark_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
