<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="popup.css">
    <title>Bookmark Intelligence</title>
  </head>
  <body>
    <main>
      <header>
        <h1>Bookmark Intelligence</h1>
        <span id="status-dot" aria-hidden="true"></span>
      </header>

      <dl>
        <div>
          <dt>Native host</dt>
          <dd id="host-status">Checking...</dd>
        </div>
        <div>
          <dt>Vault</dt>
          <dd id="vault-path">Unknown</dd>
        </div>
        <div>
          <dt>Last check</dt>
          <dd id="last-check">-</dd>
        </div>
      </dl>

      <section class="actions" aria-label="Actions">
        <button id="test-button" type="button">Test connection</button>
        <button id="download-agent-button" type="button" class="secondary">Get local agent</button>
        <button id="settings-button" type="button" class="secondary">Settings</button>
      </section>
      <p id="detail"></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
