[database]
path = "${state}\\bookmark-agent.sqlite3"

[obsidian]
vault_path = "D:\\obsidian"
notes_subdir = "Bookmarks"

[summarizer]
# Set provider to hosted to use the optional central gateway documented in server/README.md.
provider = "ollama"
base_url = "http://localhost:11434"
model = "qwen2.5:7b"
api_key_env = ""
timeout_seconds = 120

[processing]
batch_size = 5
max_retries = 3
retry_backoff_seconds = 300
store_extracted_text_in_sqlite = false

[browser_scan]
enabled = true
interval_seconds = 60

[notifications]
enabled = true
desktop = false
activity_log = true
activity_note = false
print_to_console = true
notify_on_start = false
notify_on_success = true
notify_on_failure = true

[support]
# Leave empty until the corresponding account is active.
github = ""
polar = ""
ko_fi = ""
buy_me_a_coffee = ""
patreon = ""
paypal = ""
toss = ""
custom = ""

[entitlements]
# Optional paid-plan service. The access token is read from the named environment variable.
endpoint = ""
account_id = ""
access_token_env = "BOOKMARK_INTELLIGENCE_ACCESS_TOKEN"
timeout_seconds = 10

[billing]
# Optional public billing page. Leave empty while checkout is not deployed.
url = ""
